<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Happy Birthday, My Love ❤️</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- floating celebration emojis -->
  <div class="confetti-container" id="confettiContainer"></div>

  <!-- main birthday card / stage container -->
  <main class="birthday-stage" id="birthdayStage">
    <div class="stage-content" id="stageContent">
      <!-- initial welcome screen -->
      <div class="stage active" data-stage="0">
        <div class="stage-inner">
          <button class="next-btn top-btn" id="startBtn">Start the journey ➡️</button>
          <h1 class="glow-text">🎂 Happy Birthday, My Love 🎂</h1>
          <p class="subtitle">1 year, 8 months of us — and today is all about you, baby.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- wish box modal -->
  <div class="wish-modal" id="wishModal">
    <div class="wish-card">
      <h2>✨ Make a wish, baby ✨</h2>
      <p class="wish-note">Don't worry — I can't see what you wished for. It's just between you and the universe.</p>
      <textarea id="wishInput" placeholder="Write your wish here..."></textarea>
      <button id="sendWishBtn">Send my wish 💫</button>
      <p class="wish-thanks" id="wishThanks"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
